<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVS NEXUS | Test Yayını Tamamlandı</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: radial-gradient(circle at 50% 20%, #111827 0%, #030712 100%);
            color: #e2e8f0;
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 48px 36px;
            max-width: 520px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .icon-wrap {
            width: 72px;
            height: 72px;
            margin: 0 auto 24px;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 14px;
            letter-spacing: -0.5px;
        }
        p {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.65;
            margin-bottom: 24px;
        }
        .badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #64748b;
            font-size: 13px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-wrap">🛡️</div>
        <h1>Test Yayını Sonlandırılmıştır</h1>
        <p>SVS NEXUS algoritmik strateji ve BIST radar test yayın süreci tamamlanmıştır. Bu bağlantı üzerinden artık veri yayını yapılmamaktadır.</p>
        <div class="badge">SVS NEXUS QUANTUM ARCHITECTURE</div>
    </div>
</body>
</html>
